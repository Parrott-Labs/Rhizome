[package]
name = "rhizome"
version = "0.3.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
directories = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["rustls"] }
